version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "chores"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  task_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["python", "/service/src/chores/task_server.py"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs/task_service"
      HOSTNAME: "task_service"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    
  users_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["python", "/service/src/chores/users_server.py"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs/users_service"
      HOSTNAME: "users_service"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
  
  house_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["python", "/service/src/chores/house_server.py"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs/house_service"
      HOSTNAME: "house_service"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
  
  api:
    build:
      dockerfile: ./services/api/Dockerfile
    command: ["uvicorn", "chores_client.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOGGING_LEVEL: "INFO"
      TASK_SERVICE_HOST: "task_service"
      TASK_SERVICE_PORT: 50053
      TASK_SERVICE_CERT_PATH: "task_service"
      USERS_SERVICE_HOST: "users_service"
      USERS_SERVICE_PORT: 50051
      USERS_SERVICE_CERT_PATH: "users_service"
      HOUSE_SERVICE_HOST: "house_service"
      HOUSE_SERVICE_PORT: 50052
      HOUSE_SERVICE_CERT_PATH: "house_service"
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs"
    depends_on:
      - task_service
      - users_service
      - house_service
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local