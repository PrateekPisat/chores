services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "chores"
    volumes:
      - postgres:/var/lib/postgresql/data
    
  task_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["python", "/service/src/chores/task_server.py"]
    ports:
      - "50053:50053"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs/task_service"
      HOSTNAME: "task_service"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
    depends_on:
      - postgres
    
  users_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["python", "/service/src/chores/users_server.py"]
    ports:
      - "50051:50051"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs/users_service"
      HOSTNAME: "users_service"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
    depends_on:
      - postgres
  
  house_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["python", "/service/src/chores/house_server.py"]
    ports:
      - "50052:50052"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs/house_service"
      HOSTNAME: "house_service"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
    depends_on:
      - postgres
  
  api:
    build:
      dockerfile: ./services/api/Dockerfile
    command: ["uvicorn", "chores_client.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      TASK_SERVICE_HOST: "task_service"
      TASK_SERVICE_PORT: 50053
      TASK_SERVICE_CERT_PATH: "task_service"
      USERS_SERVICE_HOST: "users_service"
      USERS_SERVICE_PORT: 50051
      USERS_SERVICE_CERT_PATH: "users_service"
      HOUSE_SERVICE_HOST: "house_service"
      HOUSE_SERVICE_PORT: 50052
      HOUSE_SERVICE_CERT_PATH: "house_service"
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs"
    depends_on:
      - task_service
      - users_service
      - house_service

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      target: development
    ports:
      - "9000:9000"
    volumes:
      - ./services/ui:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
      VITE_AUTH0_DOMAIN: "${VITE_AUTH0_DOMAIN}"
      VITE_AUTH0_CLIENT_ID: "${VITE_AUTH0_CLIENT_ID}"
      VITE_AUTH0_AUDIENCE: "${VITE_AUTH0_AUDIENCE}"
    depends_on:
      - api

volumes:
  postgres:
    driver: local