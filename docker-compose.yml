services:
  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "chores"
    volumes:
      - postgres:/var/lib/postgresql/data
    
  task_service:
    build:
      dockerfile: ./services/server/Dockerfile
    stdin_open: true
    tty: true
    command: ["poetry", "run", "python", "/service/src/chores/task_server.py"]
    ports:
      - "50053:50053"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs"
    depends_on:
      - postgres
    
  users_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["poetry", "run", "python", "/service/src/chores/users_server.py"]
    ports:
      - "50051:50051"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs"
    depends_on:
      - postgres
  
  house_service:
    build:
      dockerfile: ./services/server/Dockerfile
    command: ["poetry", "run", "python", "/service/src/chores/house_server.py"]
    ports:
      - "50052:50052"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOGGING_LEVEL: "INFO"
      DATABASE_HOST: "postgres"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_DATABASE: "chores"
      DATABASE_PORT: 5432
      SECRET_KEY: "${SECRET_KEY}"
      CERTS_PATH: "/service/certs"
    depends_on:
      - postgres

volumes:
  postgres:
    driver: local