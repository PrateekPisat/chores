version: '3.8'

services:
  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - ui
    networks:
      - frontend

networks:
  frontend:
    driver: bridge