[project]
name = "chores-client"
version = "0.1.0"
description = "A client for the chores api"
readme = "README.md"
authors = [{ name = "Prateek Pisat", email = "pisatprateek12@gmail.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "chores",
    "dataclass-settings>=0.4.0,<0.5",
    "sqlalchemy-declarative-extensions[parse]>=0.13.0,<0.14",
    "alembic>=1.13.2,<2",
    "psycopg2-binary>=2.9.9,<3",
    "pydantic-settings>=2.5.2,<3",
    "pendulum>=3.0.0,<4",
    "pyjwt[crypto]>=2.9.0,<3",
    "setuplog>=0.4.1,<0.5",
    "fastapi[standard]",
    "uvicorn>=0.34.0,<0.35",
]

[tool.uv.sources]
chores = { path = "../server", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.6.2,<0.7",
    "pytest>=8.3.2,<9",
    "mypy>=1.11.2,<2",
    "pytest-grpc>=0.8.0,<0.9",
    "pytest-mock-resources[postgres-binary,docker]>=2.12.1,<3",
    "sqlalchemy-model-factory>=0.4.6,<0.5",
    "faker>=30.0.0,<31",
    "coverage>=7.6.1,<8",
]

[tool.ruff]
extend = "../../ruff.toml"
line-length = 100

[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ELLIPSIS"
addopts = "--doctest-modules -vv --ff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
