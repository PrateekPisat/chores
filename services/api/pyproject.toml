[tool.poetry]
name = "chores"
version = "0.1.0"
description = ""
authors = ["Prateek Pisat <pisatprateek12@gmail.com>"]
readme = "README.md"
packages = [
  {include = "chores", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.12"
grpcio = "^1.66.0"
grpcio-tools = "^1.66.0"
dataclass-settings = "^0.4.0"
pydantic = "^2.8.2"
sqlalchemy-declarative-extensions = {version = "^0.13.0", extras = ["parse"]}
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"
dependency-injector = "^4.42.0"
pydantic-settings = "^2.5.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.2"
pytest = "^8.3.2"
mypy = "^1.11.2"
pytest-grpc = "^0.8.0"
pytest-mock-resources = {version = "^2.12.1", extras = ["postgres-binary", "docker"]}
sqlalchemy-model-factory = "^0.4.6"
faker = "^30.0.0"
coverage = "^7.6.1"

[tool.ruff]
extend = '../../ruff.toml'
line-length = 120


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
