[tool.poetry]
name = "chores-client"
version = "0.1.0"
description = "A client for the chores api"
authors = ["Prateek Pisat <pisatprateek12@gmail.com>"]
readme = "README.md"
packages = [{ include = "chores_client", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
chores = { path = "../server", develop = true }

dataclass-settings = "^0.4.0"
sqlalchemy-declarative-extensions = { version = "^0.13.0", extras = ["parse"] }
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.5.2"
pendulum = "^3.0.0"
pyjwt = { version = "^2.9.0", extras = ["crypto"] }
setuplog = "^0.4.1"
fastapi = { version = "*", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.2"
pytest = "^8.3.2"
mypy = "^1.11.2"
pytest-grpc = "^0.8.0"
pytest-mock-resources = { version = "^2.12.1", extras = [
    "postgres-binary",
    "docker",
] }
sqlalchemy-model-factory = "^0.4.6"
faker = "^30.0.0"
coverage = "^7.6.1"

[tool.ruff]
extend = '../../ruff.toml'
line-length = 100

[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ELLIPSIS"
addopts = "--doctest-modules -vv --ff"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
