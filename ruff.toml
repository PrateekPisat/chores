src = ["src", "tests"]
namespace-packages = ["chores"]
target-version = "py312"


[lint]
select = ["C", "D", "E", "F", "I", "N", "Q", "RET", "RUF", "S", "T", "UP", "YTT"]
ignore = [
    "C901",
    "E501",
    "S101",
    "N818",  # Exceptions must end with "Error" or other qualifiers (would enable, we just have some violations currently).
    "N999",  # Invalid module name, seeming false positives
    "N802",  # Function name should be lowercase, we should un-ignore this
]
extend-select = ["D"]
extend-ignore = [
    "D1",

    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "C408",  # Unnecessary `dict` call, we should un-ignore this
    "RET504",  # Unnecessary variable assignment before return, we should un-ignore this
    "RUF012",
]

[lint.pep8-naming]
classmethod-decorators = ["classmethod", "root_validator", "validator", "pydantic.root_validator", "pydantic.validator"]

[lint.isort]
known-first-party = ["ma"]
order-by-type = false

[lint.per-file-ignores]
"**/tests/**/*.py" = ["D", "S", "N801", "N802", 'N806', 'T201']
